name: Android Release

on:
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: true

env:
  SERVER_URL: ${{ vars.SERVER_URL }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./client/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build React app
        run: |
          export REACT_APP_VERSION=$(node -p "require('./package.json').version")
          npx cross-env CI=false GENERATE_SOURCEMAP=false REACT_APP_SERVER_URL=${{ env.SERVER_URL }} REACT_APP_VERSION=$REACT_APP_VERSION react-scripts build
        working-directory: client

      - name: Add Android platform and sync
        run: rm -rf android && npx cap add android && npx cap sync android
        working-directory: client

      - name: Apply Android customizations
        working-directory: client
        run: |
          git checkout -- android/app/src/main/AndroidManifest.xml android/app/src/main/java/com/nexus/app/MainActivity.java
          node scripts/generate-icons.mjs

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexus-release.keystore"

      - name: Build signed release APK
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/nexus-release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=nexus-key \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify APK exists
        id: find-apk
        run: |
          APK_PATH=$(find client/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found after build!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Create release with APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}-android
          name: "Nexus v${{ steps.version.outputs.version }} (Android)"
          body: |
            **Nexus v${{ steps.version.outputs.version }} — Android**

            Commit: `${{ github.sha }}`

            Download the `.apk` file below and install on your Android device.
          prerelease: false
          draft: false
          files: ${{ steps.find-apk.outputs.apk_path }}
