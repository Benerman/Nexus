name: Release Build

on:
  workflow_dispatch:

concurrency:
  group: release-build
  cancel-in-progress: true

env:
  SERVER_URL: ${{ vars.SERVER_URL }}

jobs:
  prepare:
    runs-on: [self-hosted, Linux]
    permissions:
      contents: write
    outputs:
      tag: v${{ steps.version.outputs.version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./client/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Nexus v${{ steps.version.outputs.version }}"
          body: |
            **Nexus v${{ steps.version.outputs.version }}**

            Commit: `${{ github.sha }}`

            ## Downloads
            | Platform | File |
            |----------|------|
            | Windows | `.exe` installer (NSIS) |
            | macOS (Apple Silicon) | `.dmg` |
            | macOS (Intel) | `.dmg` |
            | Linux | `.AppImage`, `.deb` |
            | iOS | `.ipa` or unsigned `.zip` |
            | Android | `.apk` (sideload) |

            ## What's Changed
            See the full changelog in the commit history.
          prerelease: false
          draft: false
          make_latest: true

  build-tauri-desktop:
    needs: prepare
    permissions:
      contents: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: [self-hosted, Linux]
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: client/src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && !contains(toJSON(matrix.platform), 'self-hosted')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
          REACT_APP_SERVER_URL: ${{ env.SERVER_URL }}
          GENERATE_SOURCEMAP: false
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tauriScript: npx tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Nexus v${{ needs.prepare.outputs.version }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-tauri-macos:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: client/src-tauri -> target

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build with Tauri (Apple Silicon)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
          REACT_APP_SERVER_URL: ${{ env.SERVER_URL }}
          GENERATE_SOURCEMAP: false
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tauriScript: npx tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Nexus v${{ needs.prepare.outputs.version }}"
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Build with Tauri (Intel)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
          REACT_APP_SERVER_URL: ${{ env.SERVER_URL }}
          GENERATE_SOURCEMAP: false
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tauriScript: npx tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Nexus v${{ needs.prepare.outputs.version }}"
          releaseDraft: false
          prerelease: false
          args: --target x86_64-apple-darwin


  build-ios:
    needs: prepare
    runs-on: [self-hosted, macOS]
    continue-on-error: true
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup macOS environment
        run: |
          if [ -d "/opt/homebrew/bin" ]; then
            echo "/opt/homebrew/bin" >> $GITHUB_PATH
            echo "/opt/homebrew/sbin" >> $GITHUB_PATH
          fi
          if [ -d "/opt/homebrew/opt/ruby/bin" ]; then
            echo "/opt/homebrew/opt/ruby/bin" >> $GITHUB_PATH
            GEM_HOME=$(/opt/homebrew/opt/ruby/bin/ruby -e 'puts Gem.user_dir')/bin
            echo "$GEM_HOME" >> $GITHUB_PATH
            echo "/opt/homebrew/lib/ruby/gems/$(/opt/homebrew/opt/ruby/bin/ruby -e 'puts RbConfig::CONFIG["ruby_version"]')/bin" >> $GITHUB_PATH
          fi

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build React app
        run: npx cross-env CI=false GENERATE_SOURCEMAP=false REACT_APP_SERVER_URL=${{ env.SERVER_URL }} react-scripts build
        working-directory: client

      - name: Add iOS platform and sync
        run: rm -rf ios && npx cap add ios && npx cap sync ios
        working-directory: client

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: client/ios/App

      - name: Build iOS app
        run: |
          xcodebuild \
            -workspace client/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Nexus.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export build
        id: export
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build/export
          if [ -n "$IOS_CERTIFICATE_BASE64" ]; then
            echo "Signing certificates found — exporting signed .ipa"
            echo "signed=true" >> "$GITHUB_OUTPUT"

            # Signing material goes in $RUNNER_TEMP (wiped after every job) and a
            # throwaway keychain that is appended to the search list, never made
            # the default. "Remove signing keychain" below deletes it even on failure.
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PW=$(openssl rand -base64 24)
            echo "$IOS_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
            security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

            echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

            cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

            xcodebuild -exportArchive \
              -archivePath build/Nexus.xcarchive \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath build/export
          else
            echo "No signing certificates — packaging unsigned .app"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            cd build/Nexus.xcarchive/Products/Applications
            zip -r ../../../export/Nexus-iOS-unsigned.zip *.app
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/build.keychain-db"; fi
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Upload iOS build to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            build/export/*.ipa
            build/export/*.zip
          overwrite_files: true

  build-android:
    needs: prepare
    runs-on: [self-hosted, Linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build React app
        run: |
          export REACT_APP_VERSION=$(node -p "require('./package.json').version")
          npx cross-env CI=false GENERATE_SOURCEMAP=false REACT_APP_SERVER_URL=${{ env.SERVER_URL }} REACT_APP_VERSION=$REACT_APP_VERSION react-scripts build
        working-directory: client

      - name: Add Android platform and sync
        run: rm -rf android && npx cap add android && npx cap sync android
        working-directory: client

      - name: Apply Android customizations
        working-directory: client
        run: |
          git checkout -- android/app/src/main/AndroidManifest.xml android/app/src/main/java/com/nexus/app/MainActivity.java
          node scripts/generate-icons.mjs

      - name: Decode keystore
        # $RUNNER_TEMP is wiped at the start and end of every job, so the
        # keystore never outlives this run on the self-hosted runner.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexus-release.keystore"

      - name: Build signed release APK and AAB
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/nexus-release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=nexus-key \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Find and rename artifacts
        id: find-artifacts
        run: |
          APK_RAW=$(find client/android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          AAB_RAW=$(find client/android/app/build/outputs/bundle/release -name "*.aab" -type f | head -1)
          if [ -z "$APK_RAW" ]; then echo "::error::No APK found!" && exit 1; fi
          if [ -z "$AAB_RAW" ]; then echo "::error::No AAB found!" && exit 1; fi
          APK_OUT="client/android/nexus-v${{ needs.prepare.outputs.version }}.apk"
          AAB_OUT="client/android/nexus-v${{ needs.prepare.outputs.version }}.aab"
          mv "$APK_RAW" "$APK_OUT"
          mv "$AAB_RAW" "$AAB_OUT"
          echo "apk_path=$APK_OUT" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB_OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK to public release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: ${{ steps.find-artifacts.outputs.apk_path }}

      - name: Upload AAB to draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: aab-${{ needs.prepare.outputs.tag }}
          name: "Nexus v${{ needs.prepare.outputs.version }} AAB (Play Store)"
          body: |
            Android App Bundle for Play Store submission only.
            **Not for direct installation.** Use the APK from the main release for sideloading.
          draft: true
          prerelease: false
          files: ${{ steps.find-artifacts.outputs.aab_path }}
